apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "saml-idp.fullname" . }}
  labels:
    {{- include "saml-idp.labels" . | nindent 4 }}
spec:
  # Each pod generates its own signing certificates, so more than one replica
  # would serve conflicting metadata. Recreate avoids two pods (with different
  # certificates) being live at once during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "saml-idp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "saml-idp.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "saml-idp.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: generate-certs
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["saml-idp-gencerts", "/var/run/saml-idp/certs"]
          volumeMounts:
            - name: certs
              mountPath: /var/run/saml-idp/certs
          resources:
            {{- toYaml .Values.initContainerResources | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--port", "8080"]
          env:
            - name: SAML_IDP_CONFIG
              value: /etc/saml-idp/config.json
            - name: SAML_IDP_CERTS_DIR
              value: /var/run/saml-idp/certs
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: certs
              mountPath: /var/run/saml-idp/certs
              readOnly: true
            # Mounted as a directory (not a subPath) so ConfigMap updates
            # reach the running app, which reloads them without a restart.
            - name: config
              mountPath: /etc/saml-idp
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: config
          configMap:
            name: {{ include "saml-idp.fullname" . }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
