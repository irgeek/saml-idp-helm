<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Test SAML IdP{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #5e6675;
      --border: #d8dce3; --accent: #2f5bd3; --accent-text: #fff;
      --ok: #1f7a3d; --bad: #b42318; --warn-bg: #fff4d6; --warn-border: #e5b53a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --panel: #1d2128; --text: #e6e8ec; --muted: #9aa3b2;
        --border: #343a45; --accent: #6d8ff0; --accent-text: #0d1220;
        --ok: #5ccf86; --bad: #ff7b6e; --warn-bg: #3a3017; --warn-border: #8c6d1c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    h2 { font-size: 1rem; margin: 0 0 12px; }
    section {
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; margin-bottom: 16px;
    }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85em; }
    pre { overflow-x: auto; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; }
    .muted { color: var(--muted); }
    .warning {
      background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: 6px;
      padding: 8px 12px; margin-bottom: 8px;
    }
    .status-valid { color: var(--ok); font-weight: 600; }
    .status-expired, .status-not-yet-valid { color: var(--bad); font-weight: 600; }
    a { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-top: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: normal; border-top: none; }
    label.cert {
      display: flex; gap: 8px; align-items: baseline; cursor: pointer;
    }
    .users { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    button {
      font: inherit; text-align: left; padding: 10px 12px; border-radius: 6px; cursor: pointer;
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
    }
    button:hover, button:focus-visible { border-color: var(--accent); outline: none; }
    button.last { border: 2px solid var(--accent); }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button .name { display: block; font-weight: 600; }
    button .email { display: block; font-size: 0.85em; color: var(--muted); overflow-wrap: anywhere; }
    button.copy {
      padding: 2px 8px; font-size: 0.8em; margin-left: 4px; white-space: nowrap;
    }
    dd.copyable { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
    dd.copyable .mono { overflow-wrap: anywhere; }
    input[type=text] {
      font: inherit; width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
    }
    .table-scroll { overflow-x: auto; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
