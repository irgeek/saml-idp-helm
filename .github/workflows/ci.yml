name: CI

on:
  pull_request:
    branches: [main]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/saml-idp

      - name: helm template (default values)
        run: |
          helm template test charts/saml-idp \
            --set sp.entityId=https://sp.example.com \
            --set sp.acsUrl=https://sp.example.com/acs

      - name: helm template (ingress with TLS)
        run: |
          helm template test charts/saml-idp \
            --set sp.entityId=https://sp.example.com \
            --set sp.acsUrl=https://sp.example.com/acs \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set 'ingress.tls[0].hosts[0]=saml-idp.example.com' \
            --set 'ingress.tls[0].secretName=saml-idp-tls'

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: ruff format
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
