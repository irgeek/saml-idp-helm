image:
  # -- Container image repository
  repository: ghcr.io/irgeek/saml-idp-helm/saml-idp
  # -- Container image tag. Defaults to the chart's appVersion when empty
  tag: ""
  # -- Container image pull policy
  pullPolicy: IfNotPresent

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the chart's generated name
nameOverride: ""
# -- Override the chart's generated fullname
fullnameOverride: ""

idp:
  # -- Public base URL of the IdP (e.g. https://saml-idp.example.com), used for
  # the entity ID and the SSO URL in the metadata. Defaults to the first
  # ingress host when the ingress is enabled; otherwise each request's own URL
  # is used.
  baseUrl: ""
  # -- IdP entity ID (the Issuer of responses). Defaults to <baseUrl>/metadata
  entityId: ""
  # -- Sign the SAML Response element
  signResponse: true
  # -- Sign the Assertion element
  signAssertion: true
  # -- How long issued assertions are valid for, in seconds
  assertionLifetimeSeconds: 300

sp:
  # -- The SP's entity ID, used as the assertion's audience. Required.
  entityId: ""
  # -- The SP's assertion consumer service URL. Required.
  acsUrl: ""
  # -- Post responses to the ACS URL named in an SP-initiated AuthnRequest
  # instead of always using sp.acsUrl
  allowRequestAcsUrl: false

# -- SAML attribute names sent for each user field. Set a name to "" to omit
# that attribute. The NameID is always the user's email address.
attributeNames:
  email: email
  firstName: first_name
  lastName: last_name

# -- Users offered on the login page. Changes are picked up without
# restarting the pod (and so without regenerating the certificates).
users:
  - email: alice@example.com
    firstName: Alice
    lastName: Anderson
  - email: bob@example.com
    firstName: Bob
    lastName: Brown

service:
  # -- Kubernetes Service type
  type: ClusterIP
  # -- Service port
  port: 80

ingress:
  # -- Create an Ingress resource
  enabled: false
  # -- IngressClass name
  className: ""
  # -- Extra annotations for the Ingress
  annotations: {}
  # -- Ingress host rules
  hosts:
    - host: saml-idp.example.com
      paths:
        - path: /
          pathType: Prefix
  # -- Ingress TLS configuration
  tls: []

# -- Pod resource requests/limits
resources: {}

# -- Resource requests/limits for the certificate-generating init container
initContainerResources: {}

# -- Pod-level securityContext
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

# -- Container-level securityContext (applied to the init container too)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  capabilities:
    drop:
      - ALL

serviceAccount:
  # -- Create a ServiceAccount
  create: true
  # -- Annotations for the ServiceAccount
  annotations: {}
  # -- Name of the ServiceAccount to use. Generated from the fullname when empty
  name: ""

# -- Additional labels applied to all resources
extraLabels: {}
# -- Additional environment variables for the container
extraEnv: []
# -- Additional volumes on the pod
extraVolumes: []
# -- Additional volumeMounts on the container
extraVolumeMounts: []

# -- Node labels for pod assignment
nodeSelector: {}
# -- Tolerations for pod assignment
tolerations: []
# -- Affinity rules for pod assignment
affinity: {}

# -- Pod annotations
podAnnotations: {}
