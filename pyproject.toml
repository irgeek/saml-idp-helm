[project]
name = "saml-idp"
description = "A test SAML 2.0 Identity Provider with switchable users and signing certificates"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "lxml>=6.1.3",
    "signxml>=5.1.0",
    "waitress>=3.0.2",
]

[project.scripts]
saml-idp = "saml_idp.server:main"
saml-idp-gencerts = "saml_idp.gencerts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/saml_idp/__init__.py"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
extend-select = [
  "B",       # flake8-bugbear
  "C",       # mccabe + flake8-comprehensions
  "E",       # pycodestyle errors
  "F",       # pyflakes
  "I",       # isort
  "INP001",  # require __init__.py (no implicit namespace packages)
  "PGH003",  # no blanket `# type: ignore`
  "PLR0915", # too-many-statements
  "T201",    # print
  "TID251",  # banned-api
  "TID252",  # relative-imports
  "W",       # pycodestyle warnings
  "D209",    # multi-line docstring closing quotes on their own line
  "D213",    # multi-line docstring summary starts on the second line
]
ignore = [
  "B011",   # assert-false
  "B018",   # useless-expression
  "B904",   # raise-without-from-inside-except
  "C408",   # unnecessary-collection-call
  "C413",   # unnecessary-call-around-sorted
  "C414",   # unnecessary-double-cast-or-process
  "C416",   # unnecessary-comprehension
  "C417",   # unnecessary-map
  "C420",   # unnecessary-dict-comprehension-for-iterable
  "C901",   # complex-structure
  "E203",   # whitespace-before-punctuation
  "E501",   # line-too-long (the formatter handles it)
  "E721",   # type-comparison
  "E731",   # lambda-assignment
  "F403",   # undefined-local-with-import-star
]
unfixable = ["B"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.lint.pylint]
max-statements = 120

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"_operator".msg = "Import from the public operator module instead of the private _operator module."
"time.time".msg = "Use time.perf_counter() for measuring durations; time.time() is only for wall-clock timestamps."
"__future__.annotations".msg = "PEP 563 postponed annotations are banned: they break runtime introspection (Pydantic, get_type_hints()). Use typing.Self, string-quoted forward references, or TYPE_CHECKING guards."
