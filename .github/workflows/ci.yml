name: CI

on:
  pull_request:
    branches: [main]

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: helm lint
        run: helm lint charts/saml-idp

      - name: helm template (default values)
        run: |
          helm template test charts/saml-idp \
            --set idp.acsUrl=https://sp.example.com/acs \
            --set idp.audience=https://sp.example.com \
            --set certificate.existingSecret.name=dummy-tls

      - name: helm template (cert-manager + ingress)
        run: |
          helm template test charts/saml-idp \
            --set idp.acsUrl=https://sp.example.com/acs \
            --set idp.audience=https://sp.example.com \
            --set certificate.certManager.enabled=true \
            --set certificate.certManager.issuerRef.name=letsencrypt \
            --set ingress.enabled=true \
            --set ingress.className=nginx

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: false
