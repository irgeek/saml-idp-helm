name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: ghcr.io/irgeek/saml-idp-helm/saml-idp
  CHART_REPO: oci://ghcr.io/irgeek/saml-idp-helm/charts

permissions:
  contents: read
  packages: write

jobs:
  compute-version:
    runs-on: ubuntu-latest
    outputs:
      # Exactly matches one of the tags build-and-push-image pushes for
      # this image, so the chart's appVersion (and therefore its default
      # image.tag) always points at an image that actually exists.
      app_version: ${{ steps.version.outputs.app_version }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            echo "app_version=${version}" >> "$GITHUB_OUTPUT"
            echo "chart_version=${version}" >> "$GITHUB_OUTPUT"
          else
            short_sha="${GITHUB_SHA:0:7}"
            echo "app_version=main-${short_sha}" >> "$GITHUB_OUTPUT"
            echo "chart_version=0.0.0-edge.g${short_sha}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  package-and-push-chart:
    needs: compute-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          helm package charts/saml-idp \
            --version "${{ needs.compute-version.outputs.chart_version }}" \
            --app-version "${{ needs.compute-version.outputs.app_version }}" \
            --destination dist

      - name: Push chart
        run: |
          helm push dist/saml-idp-"${{ needs.compute-version.outputs.chart_version }}".tgz "${{ env.CHART_REPO }}"
